services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  user-service:
    image: abdulsamie313/user-service:latest
    build:
      context: ./user-service
    container_name: user-service-app
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: deployment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

  notification-service:
    image: abdulsamie313/notification-service:latest
    build:
      context: ./notification-service
    container_name: notification-service-app
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: deployment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"

  analytics-service:
    image: abdulsamie313/analytics-service:latest
    build:
      context: ./analytics-service
    container_name: analytics-service-app
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: deployment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"

  frontend:
    image: abdulsamie313/event-driven-ui:latest
    build:
      context: ./event-driven-ui
    container_name: event-driven-ui-app
    depends_on:
      - user-service
    ports:
      - "4200:80"

volumes:
  postgres_data: