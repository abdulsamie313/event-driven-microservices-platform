<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4">Create User</h2>

        <!-- Success Message -->
        <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="createUser()">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" [(ngModel)]="user.name" name="name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" [(ngModel)]="user.email" name="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" [(ngModel)]="user.password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create User
            </button>

        </form>
        <hr class="my-4">

        <h4>Users</h4>

        <table class="table table-striped mt-3" *ngIf="users.length > 0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let u of users">
                    <td>{{ u.id || u.userId }}</td>
                    <td>{{ u.name }}</td>
                    <td>{{ u.email }}</td>
                </tr>
            </tbody>
        </table>

        <div *ngIf="users.length === 0" class="text-muted">
            No users found.
        </div>
    </div>
</div>
